models:
  - name: dim_listings_cleansed
    description: Cleansed tables which contains Airbnb listing
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
    columns:
      - name: listing_id
        description: PK for listing
        data_tests:
        - unique
        - not_null

      - name: host_id
        description: Host's id, referncing the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of room for listing
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt','Private room','Shared room','Hotel room']

      - name: minimum_nights
        #description: '{{ doc("dim_listings_cleansed_minimum_nights")}}'
        data_tests:
          - positive_values


  - name: dim_hosts_cleansed # adding a data contract
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        deprecation_date: 2027-01-01
      - v: 2
        defined_in: dim_hosts_cleansed_v2
    latest_version: 2
    description: Cleansed host data
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: host id
        data_type: integer
        constraints:
          - type: not_null

        data_tests:
          - not_null
          - unique
      - name: host_name
        description: host name
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: is_superhost
        description: flag identifying is super host or not
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t','f']
      - name: updated_at
        data_type: timestamp
      - name: created_at
        data_type: timestamp

  - name: dim_listings_with_hosts
    tests:
        - dbt_expectations.expect_table_row_count_to_equal_other_table:
            compare_model: ref('src_listings')
    columns:
      - name: price
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
                  arguments:
                  quantile: .99
                  min_value: 50
                  max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
                  arguments:
                  max_value: 5000
                  config: 
                    severity: warn #can add this config to any test!
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                  column_type: number